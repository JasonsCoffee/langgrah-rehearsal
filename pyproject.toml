[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-coder"
version = "0.1.0"
description = "Contract-driven, stack-agnostic parallel coding framework"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-cli[inmem]>=0.4,<0.5",
  "tree-sitter>=0.26,<0.27",
  "tree-sitter-c-sharp>=0.23,<0.24",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

